<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEase — Hotel Booking</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="brand">🏨 StayEase</h1>
        <p class="tagline">Find your perfect stay</p>
      </div>
    </header>

    <main class="container">
      <section class="search-panel" aria-labelledby="search-heading">
        <h2 id="search-heading">Search availability</h2>
        <form id="search-form" class="search-form" novalidate>
          <div class="field">
            <label for="checkIn">Check-in</label>
            <input type="date" id="checkIn" name="checkIn" required />
          </div>
          <div class="field">
            <label for="checkOut">Check-out</label>
            <input type="date" id="checkOut" name="checkOut" required />
          </div>
          <div class="field">
            <label for="guests">Guests</label>
            <input type="number" id="guests" name="guests" min="1" max="16" value="2" required />
          </div>
          <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
        </form>
        <p id="search-error" class="error-text" role="alert" hidden></p>
      </section>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading" class="section-title" hidden>Available rooms</h2>
        <div id="results" class="results-grid" aria-live="polite"></div>
      </section>
    </main>

    <!-- Booking modal -->
    <div id="booking-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
        <h2 id="modal-title">Complete your booking</h2>
        <p id="booking-summary" class="booking-summary"></p>
        <form id="booking-form" class="booking-form" novalidate>
          <input type="hidden" id="roomTypeId" name="roomTypeId" />
          <div class="field">
            <label for="guestName">Full name</label>
            <input type="text" id="guestName" name="guestName" required />
          </div>
          <div class="field">
            <label for="guestEmail">Email</label>
            <input type="email" id="guestEmail" name="guestEmail" required />
          </div>
          <button type="submit" class="btn btn-primary" id="confirm-btn">Confirm booking</button>
        </form>
        <p id="booking-error" class="error-text" role="alert" hidden></p>
      </div>
    </div>

    <!-- Confirmation toast -->
    <div id="confirmation" class="confirmation" hidden role="status">
      <div class="confirmation-content">
        <span class="check">✓</span>
        <div>
          <strong>Booking confirmed!</strong>
          <p id="confirmation-detail"></p>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <p>StayEase · Built with Kiro for the Kiro University Challenge</p>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
